[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server exposing Garmin Connect activity data (FIT → DuckDB) to Claude"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "nmatout" }]
keywords = ["mcp", "garmin", "fit", "duckdb", "running", "triathlon"]

dependencies = [
    "mcp>=2.0.0",
    "garminconnect>=0.3.9",
    "fitdecode>=0.11.0",
    "duckdb>=1.1.0",
    # DuckDB converts TIMESTAMPTZ to Python datetimes through pytz and
    # raises at query time without it. Not a declared duckdb dependency,
    # so it has to be pinned here or every UTC column read fails.
    "pytz>=2024.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.optional-dependencies]
# Heavy fallback backend: pulls Chromium. Installed only in the `playwright`
# Docker target, or locally with `uv sync --extra playwright`.
playwright = ["playwright>=1.47"]

[project.scripts]
garmin-mcp = "garmin_mcp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French text in comments/docstrings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["garmin_mcp"]

[[tool.mypy.overrides]]
# Neither ships type stubs.
module = ["fitdecode.*", "garminconnect.*"]
ignore_missing_imports = true
